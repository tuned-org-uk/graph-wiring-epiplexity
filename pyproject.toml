[project]
name = "epiplexity"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "sentence-transformers==5.3.0"
]

[tool.setuptools.packages.find]
where = ["epiplexity"]
# include = ["my_package*"]
# exclude = ["my_package.tests*"]  # Exclude test folders

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[tool.pytest.ini_options]
testpaths = ["epiplexity/tests"]
pythonpath = ["."]
addopts = ["--import-mode=importlib", "--maxfail=2", "-v"]


