[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
# Explicit runtime paths prevent examples and research assets entering wheels.
include = [
  "/epiplexity/*.py",
  "/epiplexity/algorithms/*.py",
  "/epiplexity/schemas/result-v1.json",
]

[tool.hatch.build.targets.sdist]
# Source releases contain buildable runtime code and release documentation only.
include = [
  "/epiplexity/*.py",
  "/epiplexity/algorithms/*.py",
  "/epiplexity/schemas/result-v1.json",
  "/pyproject.toml",
  "/README.md",
  "/LICENSE",
  "/CHANGELOG.md",
  "/docs/v0.6.md",
]

[project]
name = "epiplexity"
version = "0.6.1"
description = "Static MDL accounting, streaming scores, and log-based epiplexity estimates"
readme = "README.md"
license = "MIT OR Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.12"
keywords = ["information-generation", "algorithm-analysis", "information-theory", "machine-learning", "complexity", "epiplexity"]
classifiers = [
    "Programming Language :: Python :: Implementation :: CPython",
    "Programming Language :: Python :: Implementation :: PyPy",
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Scientific/Engineering :: Information Analysis",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Database :: Front-Ends",  # for vector DB/search integrations
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Operating System :: OS Independent",
]

# Lean core: only numpy is required to use the engine, the TTimeProbabilisticModel
# ABC, and the ArrowSpace adapter. Heavy ML deps are opt-in via extras.
dependencies = [
  "numpy>=1.20",
]

[project.scripts]
epiplexity = "epiplexity.cli:main"

[project.optional-dependencies]
# PyTorch-based algorithm adapters (torch_classifier, gnn).
torch = [
  "torch",
]
# HuggingFace Transformers-based adapter (transformer_lm).
transformers = [
  "torch",
  "transformers",
]
# Notebook stack: sentence-transformers + the algorithm extras needed to run the
# example notebooks. Install with `pip install epiplexity[notebooks]`.
notebooks = [
  "sentence-transformers==5.6.1",
  "epiplexity[torch,transformers]",
]
# Test/development stack.
dev = [
  "pytest>=8.0",
  "jsonschema>=4",
  "epiplexity[torch,transformers]",
  "scipy",
]

[tool.pytest.ini_options]
testpaths = ["epiplexity/tests"]
pythonpath = ["."]
addopts = ["--import-mode=importlib", "--maxfail=2", "-v"]
